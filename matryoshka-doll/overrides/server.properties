# Matryoshka Doll 整合包服务端设置
# Server settings tuned for long play sessions

# 允许飞行（玩家毕业阶段需要）
allow-flight=true

# 难度：普通（推荐）
difficulty=normal

# 视距
view-distance=10

# 模拟距离
simulation-distance=8

# 最大玩家数
max-players=8

# 服务器端口
server-port=25565

# 启用白名单（开发期关闭）
white-list=false

# 启用命令方块（自动化需要）
enable-command-block=true

# 防止多人刻利用
max-tick-time=-1

# 在线模式
online-mode=true

# 玩家闲置超时（0=不踢）
max-idle-time=0

# 强制游戏模式为生存
gamemode=survival
force-gamemode=true

# 启用 snooper
snooper-enabled=false

# 启用 rcon
enable-rcon=false

# 启用查询
enable-query=false

# 资源包（空）
resource-pack=
