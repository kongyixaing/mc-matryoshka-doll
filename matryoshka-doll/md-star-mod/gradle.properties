# Forge & Minecraft versions (1.20.1)
minecraft_version=1.20.1
forge_version=47.3.12

# Mod metadata
mod_id=mdstar
mod_name=MD Star
mod_version=0.1.0-alpha
mod_group_id=com.matryoshka.mdstar
mod_authors=MD
mod_description=Matryoshka Doll 整合包毕业 mod - 现代大型机械多方块结构，用于合成 MD 之星。

# Mappings
mapping_channel=official
mapping_version=1.20.1

# Dependencies versions
create_version=0.5.1.f
gtceu_version=1.3.0
ae2_version=15.2.11
jei_version=15.2.0.27

# Proxy for remote sandbox network egress
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|.svc|.cluster.local
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.https.nonProxyHosts=localhost|127.0.0.1|.svc|.cluster.local

# Allow insecure HTTPS resolution through the corporate proxy (sandbox egress)
systemProp.javax.net.ssl.trustStoreType=JKS
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
